services:
  sunsetradar:
    build: .
    image: sunset-radar:1.0.0
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      DATABASE_PATH: /data/sunsetradar.db
      REPOS_DIR: /data/repos
    volumes:
      - radar-data:/data
      # Mount the repositories you want watched, read-only.
      # - /srv/my-app:/repos/my-app:ro

volumes:
  radar-data:
